<!doctype html>
<!--
  The space backdrop for 3D Drawings: a walk across a bright cartoon moon.
  The camera glides forward; craters, pebbles, rocks, a rocket on its pad,
  crystals, a flag and a glass moon base come towards us and pass on both
  sides, while the middle stays clear so the children's drawings seem to walk
  along with us. Up in the sky (too far off to move) are a ringed planet, the
  turning Earth, twinkling stars, a UFO and shooting stars.

  It's painted to look solid: one light from the top right (the side the
  stage's sun is on, so the drawings' shadows agree), round things shaded
  like balls, crater bowls lit on one wall, crystals with three faces, cast
  shadows falling left, soft outlines and a pink haze on far-off things.

  draw(t) paints the frame at t seconds. Everything repeats every T seconds,
  so the film loops without a jump. Rendered by render.mjs.
-->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720, T = 16, TAU = Math.PI * 2;
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const HORIZON = 392; // where the moon meets the sky

function rng(seed) {
  return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
}
/** A wave that repeats exactly k times per loop. */
const wave = (t, k = 1, ph = 0) => Math.sin((TAU * k * t) / T + ph);
const lerp = (a, b, f) => a + (b - a) * f;
const OUT = "rgba(34,10,92,0.55)"; // a soft outline — shading does the rest

/* ---------- things placed once ---------- */
const R = rng(7);
const stars = [];
for (let i = 0; i < 280; i++) {
  stars.push({
    x: R() * W, y: Math.pow(R(), 1.25) * (HORIZON - 30),
    r: 0.5 + R() * 1.6, k: 1 + Math.floor(R() * 4), ph: R() * TAU,
    c: ["#ffffff", "#fff27a", "#9ff0ff", "#ffb3ec"][Math.floor(R() * 4)],
  });
}
const sparkles = [
  [520, 60, 11], [700, 130, 8], [610, 250, 7], [985, 300, 9], [380, 245, 8],
  [860, 200, 10], [470, 140, 6], [760, 40, 7], [1020, 210, 6], [300, 300, 6],
  [90, 300, 8], [1210, 260, 9], [1240, 40, 6], [40, 60, 7],
].map(([x, y, s], i) => ({ x, y, s, k: 1 + (i % 3), ph: i * 1.7,
  c: ["#fff35c", "#ffffff", "#7ff3ff", "#ff9be8"][i % 4] }));

const RD = rng(99);
const dust = Array.from({ length: 40 }, () => ({
  x: RD() * W, y: RD() * H, r: 0.8 + RD() * 1.8, ph: RD(), k: 1 + Math.floor(RD() * 2),
}));

/* ---------- little helpers ---------- */
function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function ellipse(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function ink(width = 3, colour = OUT) {
  g.lineWidth = width * 0.7; g.strokeStyle = colour; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
}
function glow(x, y, r, colour, alpha) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, colour.replace("A", alpha));
  gr.addColorStop(1, colour.replace("A", 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function sparkle(x, y, s, colour) {
  g.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8 - TAU / 4;
    const rr = i % 2 ? s * 0.28 : s;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fillStyle = colour; g.fill();
}
const stops = (gr, list) => { for (const [o, c] of list) gr.addColorStop(o, c); return gr; };
const hGrad = (x0, x1, list) => stops(g.createLinearGradient(x0, 0, x1, 0), list);
const vGrad = (y0, y1, list) => stops(g.createLinearGradient(0, y0, 0, y1), list);
/** A ball lit from the top right: bright spot, colour, then dark round the back. */
function ball(x, y, r, list) {
  return stops(g.createRadialGradient(x + r * 0.38, y - r * 0.42, r * 0.04, x + r * 0.12, y - r * 0.12, r * 1.18), list);
}
/** A thin bright edge on the lit side, as on a real round thing. */
function rim(x, y, r, colour = "rgba(255,255,255,0.55)") {
  g.beginPath(); g.arc(x, y, r * 0.93, -1.25, 0.55); g.lineWidth = Math.max(1, r * 0.07); g.strokeStyle = colour; g.stroke();
}
function shine(x, y, rx, ry, a = 0.8, rot = -0.6) {
  const gr = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(1, ry / rx); g.translate(-x, -y);
  g.fillStyle = gr; circle(x, y, rx); g.fill(); g.restore();
}

/* ---------- the sky ---------- */
function sky(t) {
  g.fillStyle = vGrad(0, HORIZON + 20, [
    [0, "#08084f"], [0.38, "#2416b8"], [0.68, "#7a14d8"], [0.9, "#ff3fb0"], [1, "#ff9ad6"],
  ]);
  g.fillRect(0, 0, W, HORIZON + 40);
  const neb = [
    [330, 120, 270, "rgba(255,60,190,A)", 0.34, 0],
    [960, 250, 300, "rgba(0,220,255,A)", 0.26, 2],
    [640, 320, 380, "rgba(255,120,220,A)", 0.3, 4],
    [1150, 330, 230, "rgba(170,90,255,A)", 0.32, 1],
    [90, 210, 240, "rgba(60,140,255,A)", 0.28, 3],
  ];
  for (const [x, y, r, c, a, ph] of neb) glow(x + 14 * wave(t, 1, ph), y + 6 * wave(t, 1, ph + 1), r, c, a);
  for (const s of stars) {
    g.globalAlpha = 0.55 + 0.45 * wave(t, s.k, s.ph);
    circle(s.x, s.y, s.r); g.fillStyle = s.c; g.fill();
  }
  g.globalAlpha = 1;
  for (const s of sparkles) {
    const tw = 0.6 + 0.4 * wave(t, s.k, s.ph);
    glow(s.x, s.y, s.s * 2.8, "rgba(255,255,255,A)", 0.32 * tw);
    sparkle(s.x, s.y, s.s * (0.7 + 0.35 * tw), s.c);
  }
}

/* ---------- the ringed planet, top left ---------- */
function ringedPlanet(t) {
  const x = 215, y = 140 + 5 * wave(t, 1), r = 80, tilt = -0.32;
  glow(x, y, r * 2.2, "rgba(255,150,60,A)", 0.4);
  const RX = r * 1.75, RY = r * 0.42;
  const ring = (front) => {
    g.save(); g.translate(x, y); g.rotate(tilt);
    const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : TAU;
    const lit = hGrad(-RX, RX, [[0, "#b8541f"], [0.45, "#ffcf5c"], [0.75, "#fff3b0"], [1, "#ffb347"]]);
    for (const [dr, w, c] of [[9, 9, lit], [0, 7, "#ff5f8f"], [-9, 8, lit], [-16, 3, "#7fe8ff"]]) {
      g.beginPath(); g.ellipse(0, 0, RX + dr, RY + dr * 0.8, 0, a0, a1);
      g.lineWidth = w; g.strokeStyle = c; g.stroke();
    }
    g.beginPath(); g.ellipse(0, 0, RX + 14, RY + 12, 0, a0, a1); ink(2.5);
    g.restore();
  };
  ring(false);
  g.save(); circle(x, y, r); g.clip();
  g.fillStyle = "#ff9a2e"; g.fillRect(x - r, y - r, r * 2, r * 2);
  const bands = ["#ff6a1f", "#ffd23f", "#ff3d5a", "#ffb02e", "#ff7d3a"];
  g.save(); g.translate(x, y); g.rotate(tilt);
  for (let i = 0; i < 7; i++) {
    const by = -r + (i + 0.5) * (r * 2 / 7);
    g.beginPath();
    for (let px = -r; px <= r; px += 4) {
      const yy = by + 5 * Math.sin(px / 18 + (TAU * t) / T + i);
      px === -r ? g.moveTo(px, yy - 7) : g.lineTo(px, yy - 7);
    }
    for (let px = r; px >= -r; px -= 4) g.lineTo(px, by + 5 * Math.sin(px / 18 + (TAU * t) / T + i + 0.6) + 7);
    g.closePath(); g.fillStyle = bands[i % bands.length]; g.fill();
  }
  // The ring's shadow across the planet.
  g.beginPath(); g.ellipse(0, 10, RX, RY, 0, 0, Math.PI); g.lineWidth = 20; g.strokeStyle = "rgba(80,10,60,0.35)"; g.stroke();
  g.restore();
  g.fillStyle = ball(x, y, r, [[0, "rgba(255,255,220,0.75)"], [0.25, "rgba(255,240,200,0.15)"], [0.62, "rgba(60,0,80,0)"], [1, "rgba(40,0,70,0.78)"]]);
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
  rim(x, y, r, "rgba(255,240,180,0.7)");
  circle(x, y, r); ink(2.5);
  ring(true);
}

/* ---------- the Earth, top right, turning ---------- */
const LANDS = [
  [0.0, -0.25, 0.42, 0.34], [0.9, 0.2, 0.36, 0.42], [1.9, -0.35, 0.5, 0.26],
  [2.9, 0.3, 0.3, 0.3], [3.8, -0.05, 0.46, 0.4], [4.9, 0.4, 0.28, 0.22], [5.6, -0.4, 0.3, 0.2],
];
const CLOUDS = [[0.4, 0.05, 0.5], [1.7, -0.55, 0.4], [2.6, 0.55, 0.45], [3.6, -0.2, 0.35], [4.6, 0.15, 0.55], [5.5, 0.6, 0.35]];
function earth(t) {
  const x = 1105, y = 118 + 4 * wave(t, 1, 2), r = 52;
  glow(x, y, r * 2.1, "rgba(60,200,255,A)", 0.5);
  g.save(); circle(x, y, r); g.clip();
  g.fillStyle = ball(x, y, r, [[0, "#9ff4ff"], [0.35, "#12b8ff"], [1, "#0638b8"]]);
  g.fillRect(x - r, y - r, r * 2, r * 2);
  const spin = (TAU * t) / T;
  const blobAt = (lon, lat, w, h, colour) => {
    const a = lon + spin, c = Math.cos(a);
    if (c < -0.1) return;
    const bx = x + Math.sin(a) * r * Math.cos(lat * 1.2), by = y + lat * r;
    ellipse(bx, by, Math.max(1, w * r * Math.max(0, c + 0.1)), h * r, 0);
    g.fillStyle = colour; g.fill();
  };
  for (const [lon, lat, w, h] of LANDS) blobAt(lon, lat, w, h, "#22d14a");
  for (const [lon, lat, w, h] of LANDS) blobAt(lon + 0.05, lat - 0.04, w * 0.7, h * 0.6, "#6cf06a");
  for (const [lon, lat, w] of CLOUDS) blobAt(lon + spin, lat, w, 0.11, "rgba(255,255,255,0.92)");
  g.fillStyle = ball(x, y, r, [[0, "rgba(255,255,255,0.5)"], [0.25, "rgba(255,255,255,0)"], [0.6, "rgba(0,0,60,0)"], [1, "rgba(0,0,50,0.75)"]]);
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
  rim(x, y, r, "rgba(170,250,255,0.85)");
  circle(x, y, r); ink(2.5);
}

/* ---------- small far planets ---------- */
function littlePlanets(t) {
  const p = [
    [890, 70, 16, ["#f2d4ff", "#b05cff", "#4a0fa8"], 0],
    [420, 52, 10, ["#d4fff0", "#1fe0a8", "#0a6a5a"], 2],
    [1230, 330, 12, ["#ffe0f0", "#ff4f9e", "#8a0a4a"], 4],
  ];
  for (const [x, y0, r, cols, ph] of p) {
    const y = y0 + 3 * wave(t, 1, ph);
    glow(x, y, r * 2.6, "rgba(255,255,255,A)", 0.16);
    circle(x, y, r); g.fillStyle = ball(x, y, r, [[0, cols[0]], [0.4, cols[1]], [1, cols[2]]]); g.fill();
    rim(x, y, r); circle(x, y, r); ink(2);
  }
}

/* ---------- shooting stars ---------- */
function shootingStars(t) {
  const runs = [[1.5, 1.1, 560, 40, 900, 150], [7.2, 1.0, 790, 28, 570, 120], [12.4, 1.0, 330, 220, 120, 300]];
  for (const [start, dur, x0, y0, x1, y1] of runs) {
    const f = (t - start) / dur;
    if (f < 0 || f > 1) continue;
    const e = f * f * (3 - 2 * f);
    const x = lerp(x0, x1, e), y = lerp(y0, y1, e);
    const fade = Math.sin(Math.PI * f);
    const tx = x - (x1 - x0) * 0.4, ty = y - (y1 - y0) * 0.4;
    const gr = g.createLinearGradient(tx, ty, x, y);
    gr.addColorStop(0, "rgba(255,120,220,0)");
    gr.addColorStop(1, `rgba(255,250,180,${0.95 * fade})`);
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(x, y);
    g.lineWidth = 4; g.strokeStyle = gr; g.stroke();
    g.globalAlpha = fade; glow(x, y, 26, "rgba(255,250,200,A)", 0.7); sparkle(x, y, 10, "#fffbd8"); g.globalAlpha = 1;
  }
}

/* ---------- a friendly UFO, far off on the right ---------- */
function ufo(t) {
  const x = 950 + 46 * wave(t, 1), y = 245 + 12 * wave(t, 2, 1);
  glow(x, y + 14, 40, "rgba(120,255,200,A)", 0.25);
  g.save(); g.translate(x, y); g.rotate(0.06 * wave(t, 2));
  ellipse(0, -9, 15, 13);
  g.fillStyle = ball(0, -9, 15, [[0, "rgba(255,255,255,0.95)"], [0.4, "rgba(150,240,255,0.85)"], [1, "rgba(40,120,220,0.9)"]]); g.fill(); ink(2);
  circle(0, -9, 6); g.fillStyle = ball(0, -9, 6, [[0, "#d9ffb0"], [0.5, "#4fe04f"], [1, "#1a8a2a"]]); g.fill();
  circle(-2, -10, 1.4); circle(2.5, -10, 1.4); g.fillStyle = "#1a0a40"; g.fill();
  ellipse(0, 0, 32, 9);
  g.fillStyle = vGrad(-9, 9, [[0, "#ffffff"], [0.4, "#c8ccf0"], [1, "#5a5f9a"]]); g.fill(); ink(2);
  for (let i = 0; i < 5; i++) {
    const on = Math.floor((t * 3 + i) % 5) === 0;
    const c = ["#ff3d6e", "#ffb02e", "#ffe83d", "#3dffb0", "#3dc8ff"][i];
    circle(-20 + i * 10, 2.5, 2.6); g.fillStyle = c; g.globalAlpha = on ? 1 : 0.45; g.fill(); g.globalAlpha = 1;
    if (on) glow(-20 + i * 10, 2.5, 10, "rgba(255,255,255,A)", 0.7);
  }
  g.restore();
}

/* ---------- the far hills ---------- */
function farHills() {
  const layer = (base, amp, top, bottom, seed) => {
    const r = rng(seed);
    const pts = [];
    for (let x = -40; x <= W + 40; x += 80) pts.push([x, base - r() * amp]);
    g.beginPath(); g.moveTo(-40, HORIZON + 30);
    g.lineTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      const [px, py] = pts[i - 1], [cx, cy] = pts[i];
      g.quadraticCurveTo(px, py, (px + cx) / 2, (py + cy) / 2);
    }
    g.lineTo(W + 40, HORIZON + 30); g.closePath();
    g.fillStyle = vGrad(base - amp, HORIZON + 10, [[0, top], [1, bottom]]); g.fill();
    g.save(); g.clip();
    // Light catching the tops from the right.
    g.fillStyle = hGrad(0, W, [[0, "rgba(40,0,90,0.25)"], [0.6, "rgba(255,255,255,0)"], [1, "rgba(255,200,255,0.25)"]]);
    g.fillRect(0, base - amp - 10, W, amp + 60);
    g.restore();
    ink(2, "rgba(60,10,120,0.5)");
  };
  layer(HORIZON - 4, 70, "#c06bff", "#6a22c8", 3);
  layer(HORIZON + 6, 34, "#e08aff", "#9440e6", 11);
}

/* ---------- walking across the moon ----------
   The camera glides forward over the ground. Everything on the moon has a
   place in the world: x across (metres, + is right) and z ahead. Nothing
   moves but the camera; the moon repeats every PERIOD metres and the camera
   walks exactly one PERIOD per loop, so the end of the film meets its start.
   The sky, planets and far hills are so far off they don't move at all. */
const PERIOD = 24;       // metres before the moon repeats (1.5 m/s walk)
const EYE = 1.6;         // how high the camera is
const F = 523;           // focal length in pixels
const NEAR = 0.7, FAR = 4 * PERIOD;
const DESIGN = 72;       // the side props were drawn at 72 px to the metre

/** Where a point on the ground lands on the screen, and pixels per metre there. */
function project(x, z) {
  return { sx: W / 2 + (F * x) / z, sy: HORIZON + (F * EYE) / z, ppm: F / z };
}
/** Far things fade in out of the haze instead of popping up. */
const haze = (z) => Math.max(0, Math.min(1, (FAR - z) / (FAR * 0.35)));

const RW = rng(31);
const speckles = [], pebbles = [], groundCraters = [], props = [];
for (let i = 0; i < 520; i++) {
  speckles.push({ x: (RW() - 0.5) * 24, z: RW() * PERIOD, r: 0.02 + RW() * 0.05, light: RW() < 0.5 });
}
for (let i = 0; i < 46; i++) {
  pebbles.push({ x: (RW() - 0.5) * 16, z: RW() * PERIOD, r: 0.05 + RW() * 0.08 });
}
// Small craters anywhere (they slide under the drawings); big ones off to the sides.
for (let i = 0; i < 10; i++) groundCraters.push({ x: (RW() - 0.5) * 6, z: RW() * PERIOD, r: 0.15 + RW() * 0.25 });
for (let i = 0; i < 12; i++) {
  const side = i % 2 ? 1 : -1;
  groundCraters.push({ x: side * (2.6 + RW() * 5), z: RW() * PERIOD, r: 0.5 + RW() * 1.1 });
}
// Upright things, kept out of the middle so the drawings have the path.
// Landmarks are seen one at a time (no row of copies into the distance).
props.push({ kind: "rocket", x: -4.4, z: 2, landmark: true });
props.push({ kind: "flag", x: 3.0, z: 8, landmark: true });
props.push({ kind: "crystals", x: -3.6, z: 13, flipped: true, landmark: true });
props.push({ kind: "crystals", x: 3.9, z: 17, landmark: true });
props.push({ kind: "dome", x: 5.2, z: 22, landmark: true });
for (let i = 0; i < 12; i++) {
  const side = i % 2 ? 1 : -1;
  props.push({ kind: "rock", x: side * (3.0 + RW() * 4), z: RW() * PERIOD, s: 0.3 + RW() * 0.5, seed: i });
}

/** Every copy of a thing that's in view this frame, at its distance. */
function copies(item, camZ, fn) {
  const base = (((item.z - camZ) % PERIOD) + PERIOD) % PERIOD;
  for (let k = 0; k <= FAR / PERIOD; k++) {
    const z = base + k * PERIOD;
    if (z > NEAR && z < FAR) fn(z);
  }
}

function groundBase() {
  g.fillStyle = vGrad(HORIZON, H, [[0, "#d47aff"], [0.2, "#a94ef2"], [0.6, "#8c34e2"], [1, "#6a1ec6"]]);
  g.fillRect(0, HORIZON, W, H - HORIZON);
  // Light from the right; a soft pool of light where the drawings stand.
  g.fillStyle = hGrad(0, W, [[0, "rgba(30,0,80,0.22)"], [0.55, "rgba(255,255,255,0)"], [1, "rgba(255,210,255,0.16)"]]);
  g.fillRect(0, HORIZON, W, H - HORIZON);
  g.save(); g.translate(W / 2, 500); g.scale(1, 0.32);
  glow(0, 0, 620, "rgba(255,200,255,A)", 0.13);
  g.restore();
}

function groundMarks(camZ) {
  for (const sp of speckles) copies(sp, camZ, (z) => {
    const p = project(sp.x, z);
    if (p.sx < -10 || p.sx > W + 10) return;
    g.globalAlpha = haze(z);
    ellipse(p.sx, p.sy, Math.max(0.6, sp.r * p.ppm), Math.max(0.35, sp.r * p.ppm * EYE / z));
    g.fillStyle = sp.light ? "rgba(255,220,255,0.4)" : "rgba(50,0,130,0.35)"; g.fill();
  });
  // Craters: a raised rim lit on the right, a bowl whose left wall catches the light.
  const list = [];
  for (const c of groundCraters) copies(c, camZ, (z) => list.push({ c, z }));
  list.sort((a, b) => b.z - a.z);
  for (const { c, z } of list) {
    const p = project(c.x, z);
    const rx = c.r * p.ppm, ry = rx * EYE / z;
    if (p.sx + rx * 1.3 < 0 || p.sx - rx * 1.3 > W) continue;
    g.globalAlpha = haze(z);
    ellipse(p.sx - rx * 0.18, p.sy + ry * 0.08, rx * 1.25, ry * 1.3); g.fillStyle = "rgba(30,0,90,0.22)"; g.fill();
    ellipse(p.sx, p.sy, rx * 1.13, ry * 1.22);
    g.fillStyle = hGrad(p.sx - rx, p.sx + rx, [[0, "#5a14b0"], [0.6, "#b25cff"], [1, "#f0b8ff"]]); g.fill();
    ellipse(p.sx, p.sy, rx, ry);
    g.fillStyle = hGrad(p.sx - rx, p.sx + rx, [[0, "#d08cff"], [0.45, "#7424d0"], [1, "#360a80"]]); g.fill();
    ellipse(p.sx + rx * 0.06, p.sy + ry * 0.28, rx * 0.58, ry * 0.42); g.fillStyle = "rgba(110,40,200,0.55)"; g.fill();
    g.beginPath(); g.ellipse(p.sx, p.sy, rx * 1.13, ry * 1.22, 0, 0.15, Math.PI - 0.15);
    g.lineWidth = Math.max(0.8, rx * 0.05); g.strokeStyle = "rgba(255,225,255,0.7)"; g.stroke();
  }
  // Pebbles: little shaded lumps with a shadow off to the left.
  for (const pb of pebbles) copies(pb, camZ, (z) => {
    const p = project(pb.x, z);
    const r = pb.r * p.ppm;
    if (p.sx + r < 0 || p.sx - r > W) return;
    g.globalAlpha = haze(z);
    ellipse(p.sx - r * 0.7, p.sy, r * 1.5, r * 0.32); g.fillStyle = "rgba(30,0,90,0.32)"; g.fill();
    ellipse(p.sx, p.sy - r * 0.45, r, r * 0.62);
    g.fillStyle = ball(p.sx, p.sy - r * 0.45, r, [[0, "#ffe6ff"], [0.3, "#b863ff"], [0.75, "#5a14b8"], [1, "#2e0878"]]); g.fill();
    if (r > 3) ink(Math.min(2, r * 0.12));
  });
  g.globalAlpha = 1;
}

/** A shaded moon rock with its shadow falling left. */
function rockAt(sx, sy, ppm, s, seed) {
  const r = rng(seed + 3);
  const rx = s * ppm, ry = rx * (0.55 + r() * 0.25), bump = 0.2 + r() * 0.4;
  ellipse(sx - rx * 0.85, sy, rx * 1.6, rx * 0.2); g.fillStyle = "rgba(30,0,90,0.34)"; g.fill();
  g.beginPath();
  g.moveTo(sx - rx, sy);
  g.bezierCurveTo(sx - rx * 1.05, sy - ry * 1.3, sx + rx * bump, sy - ry * 1.6, sx + rx, sy);
  g.closePath();
  g.fillStyle = stops(g.createRadialGradient(sx + rx * 0.35, sy - ry * 0.95, rx * 0.05, sx + rx * 0.1, sy - ry * 0.5, rx * 1.5),
    [[0, "#ffeaff"], [0.18, "#d08cff"], [0.5, "#8a30e6"], [0.8, "#4e10a8"], [1, "#2a0670"]]);
  g.fill(); ink(Math.max(1, Math.min(3, ppm * 0.04)));
  shine(sx + rx * 0.3, sy - ry * 0.95, rx * 0.28, ry * 0.16, 0.55);
  ellipse(sx, sy - 0.5, rx * 0.95, Math.max(1, rx * 0.06)); g.fillStyle = "rgba(30,0,90,0.35)"; g.fill();
}

/** A little glass moon base with a round door and a blinking aerial. */
function dome(t, sx, sy, ppm) {
  const k = ppm / DESIGN;
  g.save(); g.translate(sx, sy); g.scale(k, k);
  ellipse(-60, 4, 160, 18); g.fillStyle = "rgba(30,0,90,0.32)"; g.fill();
  ellipse(0, 0, 112, 20); g.fillStyle = vGrad(-20, 20, [[0, "#f0e6ff"], [0.5, "#a98aff"], [1, "#4a2a9e"]]); g.fill(); ink(3);
  g.beginPath(); g.moveTo(-100, 0); g.arc(0, 0, 100, Math.PI, TAU); g.closePath();
  g.fillStyle = ball(0, -45, 100, [[0, "rgba(255,255,255,0.95)"], [0.3, "rgba(120,235,255,0.8)"], [0.8, "rgba(40,120,240,0.85)"], [1, "rgba(30,40,170,0.9)"]]);
  g.fill(); ink(3);
  g.beginPath(); g.arc(0, 0, 100, Math.PI * 1.15, Math.PI * 1.85); ink(2, "rgba(255,255,255,0.4)");
  g.beginPath(); g.moveTo(0, -100); g.lineTo(0, 0); ink(2, "rgba(255,255,255,0.35)");
  glow(-30, -30, 60, "rgba(255,210,90,A)", 0.7);
  g.beginPath(); g.moveTo(-24, 0); g.lineTo(-24, -34); g.arc(-4, -34, 20, Math.PI, TAU); g.lineTo(16, 0); g.closePath();
  g.fillStyle = hGrad(-24, 16, [[0, "#e09a00"], [0.6, "#ffd43b"], [1, "#fff0a0"]]); g.fill(); ink(3);
  circle(10, -18, 3); g.fillStyle = "#5a2a00"; g.fill();
  shine(48, -66, 26, 12, 0.85);
  g.beginPath(); g.moveTo(40, -92); g.lineTo(52, -150); g.lineWidth = 5; g.strokeStyle = hGrad(38, 54, [[0, "#6a5aa8"], [0.6, "#ffffff"], [1, "#a89ad8"]]); g.stroke();
  const on = Math.floor(t * 1.5) % 2 === 0;
  circle(52, -154, 7); g.fillStyle = on ? ball(52, -154, 7, [[0, "#ffffff"], [0.4, "#4dff9a"], [1, "#0a8a4a"]]) : "#1f5a3f"; g.fill(); ink(2);
  if (on) glow(52, -154, 34, "rgba(80,255,160,A)", 0.7);
  g.restore();
}

/** Draw a prop designed standing at (ax, ay), at its place on the moon. */
function placed(sx, sy, ppm, ax, ay, fn, flipped) {
  const k = ppm / DESIGN;
  g.save(); g.translate(sx, sy); g.scale(flipped ? -k : k, k); g.translate(-ax, -ay);
  fn(); g.restore();
}

function walkingProps(t, camZ) {
  const list = [];
  for (const pr of props) copies(pr, camZ, (z) => list.push({ pr, z }));
  list.sort((a, b) => b.z - a.z);
  for (const { pr, z } of list) {
    if (pr.landmark && z > PERIOD) continue;
    const p = project(pr.x, z);
    if (p.sx < -p.ppm * 3 || p.sx > W + p.ppm * 3) continue;
    const fadeIn = pr.landmark ? Math.min(1, (PERIOD - z) / (PERIOD * 0.3)) : haze(z);
    const fadeOut = Math.min(1, Math.max(0, (z - 1.0) / 1.2)); // just before it passes us
    g.globalAlpha = Math.max(0, fadeIn * fadeOut);
    if (pr.kind === "rock") rockAt(p.sx, p.sy, p.ppm, pr.s, pr.seed);
    else if (pr.kind === "rocket") placed(p.sx, p.sy, p.ppm, 150, 536, () => rocket(t));
    else if (pr.kind === "flag") placed(p.sx, p.sy, p.ppm, 1010, 480, () => flag(t));
    else if (pr.kind === "dome") dome(t, p.sx, p.sy, p.ppm);
    else if (pr.kind === "crystals") placed(p.sx, p.sy, p.ppm, 1180, 552, () => crystals(t, !!pr.flipped), pr.flipped);
    g.globalAlpha = 1;
  }
}

/* ---------- the rocket on its launch pad ---------- */
function rocket(t) {
  const bx = 150, by = 530;
  // Its shadow, falling left.
  ellipse(bx - 120, by + 8, 150, 16); g.fillStyle = "rgba(30,0,90,0.3)"; g.fill();
  // The launch tower behind it: a square girder, lit on its right face.
  g.fillStyle = hGrad(bx - 95, bx - 81, [[0, "#4a1f9e"], [0.5, "#8f5ae6"], [1, "#c8a2ff"]]);
  g.fillRect(bx - 95, by - 230, 14, 230);
  g.beginPath(); g.rect(bx - 95, by - 230, 14, 230); ink(2.5);
  for (let i = 0; i < 8; i++) {
    g.beginPath(); g.moveTo(bx - 95, by - 220 + i * 28); g.lineTo(bx - 81, by - 206 + i * 28); ink(2, "rgba(40,10,100,0.5)");
  }
  g.fillStyle = vGrad(by - 150, by - 142, [[0, "#d8c2ff"], [1, "#5a2ab0"]]);
  g.fillRect(bx - 81, by - 150, 36, 8); g.beginPath(); g.rect(bx - 81, by - 150, 36, 8); ink(2);
  const blink = (Math.floor(t * 2) % 2) === 0;
  circle(bx - 88, by - 238, 6);
  g.fillStyle = blink ? ball(bx - 88, by - 238, 6, [[0, "#ffffff"], [0.4, "#ff3d6e"], [1, "#a0002a"]]) : "#6a1a35"; g.fill(); ink(2);
  if (blink) glow(bx - 88, by - 238, 32, "rgba(255,60,110,A)", 0.75);
  // The pad: a metal disc, lit on top.
  ellipse(bx, by + 6, 92, 20); g.fillStyle = hGrad(bx - 92, bx + 92, [[0, "#3d1a8a"], [0.7, "#8a5ae0"], [1, "#b892ff"]]); g.fill(); ink(3);
  ellipse(bx, by, 80, 15); g.fillStyle = hGrad(bx - 80, bx + 80, [[0, "#9a7ad8"], [0.65, "#efe4ff"], [1, "#c8b0ff"]]); g.fill(); ink(2);
  for (let i = 0; i < 6; i++) {
    const f = ((t / T) * 4 + i / 6) % 1;
    const side = i % 2 ? 1 : -1;
    const px = bx + side * (18 + f * 60), py = by - 4 - f * 34, pr = 10 + f * 16;
    g.globalAlpha = 0.9 * (1 - f);
    circle(px, py, pr); g.fillStyle = ball(px, py, pr, [[0, "#ffffff"], [0.6, "#f2e8ff"], [1, "#c4a8f0"]]); g.fill();
    g.globalAlpha = 1;
  }
  const hover = 1.2 * wave(t, 6);
  g.save(); g.translate(bx, by - 12 + hover);
  const fin = (s) => {
    g.beginPath(); g.moveTo(s * 26, -70); g.quadraticCurveTo(s * 58, -40, s * 52, 0); g.lineTo(s * 24, -18); g.closePath();
    g.fillStyle = s > 0
      ? hGrad(24, 58, [[0, "#ff2d55"], [0.5, "#ff7a8f"], [1, "#d0103a"]])
      : hGrad(-58, -24, [[0, "#7a0022"], [1, "#e0163f"]]);
    g.fill(); ink(2.5);
  };
  fin(-1); fin(1);
  // The body: a shiny rounded cylinder, brightest a little right of middle.
  g.beginPath();
  g.moveTo(0, -205);
  g.bezierCurveTo(40, -170, 36, -60, 28, -14);
  g.lineTo(-28, -14);
  g.bezierCurveTo(-36, -60, -40, -170, 0, -205);
  g.fillStyle = hGrad(-34, 36, [[0, "#6f5fc0"], [0.3, "#c8c0f5"], [0.62, "#ffffff"], [0.85, "#e4dcff"], [1, "#9c8ee0"]]);
  g.fill(); ink(3);
  g.save(); g.clip();
  g.fillStyle = hGrad(-40, 40, [[0, "#8a0026"], [0.35, "#ff2d55"], [0.62, "#ff8fa3"], [0.85, "#ff4065"], [1, "#b0002f"]]);
  g.fillRect(-45, -215, 90, 52);
  g.beginPath(); g.moveTo(-45, -163); g.lineTo(45, -163); ink(2.5);
  g.fillStyle = hGrad(-40, 40, [[0, "#8a0026"], [0.35, "#ff2d55"], [0.62, "#ff8fa3"], [0.85, "#ff4065"], [1, "#b0002f"]]);
  g.fillRect(-45, -56, 90, 12);
  g.restore();
  // A porthole: gold ring, glossy glass.
  circle(0, -118, 17); g.fillStyle = ball(0, -118, 17, [[0, "#fff6c0"], [0.45, "#ffc21a"], [1, "#a05a00"]]); g.fill(); ink(2.5);
  circle(0, -118, 11); g.fillStyle = ball(0, -118, 11, [[0, "#e8fbff"], [0.35, "#22b4ff"], [1, "#062f8a"]]); g.fill(); ink(1.5);
  shine(4, -123, 5, 3, 0.95);
  // Middle fin and nozzle.
  g.beginPath(); g.moveTo(-6, -60); g.lineTo(6, -60); g.lineTo(4, -8); g.lineTo(-4, -8); g.closePath();
  g.fillStyle = hGrad(-6, 6, [[0, "#9a0030"], [0.6, "#ff5a78"], [1, "#d0103a"]]); g.fill(); ink(2);
  g.beginPath(); g.moveTo(-18, -14); g.lineTo(18, -14); g.lineTo(22, 0); g.lineTo(-22, 0); g.closePath();
  g.fillStyle = hGrad(-22, 22, [[0, "#2a1a5a"], [0.65, "#a89ad8"], [1, "#5a4a9a"]]); g.fill(); ink(2.5);
  // A long highlight down the lit side of the body.
  g.beginPath(); g.moveTo(14, -180); g.bezierCurveTo(24, -150, 22, -70, 18, -24);
  g.lineWidth = 4; g.strokeStyle = "rgba(255,255,255,0.75)"; g.stroke();
  g.restore();
}

/* ---------- crystals and a flag ---------- */
const GEMS = {
  cyan: ["#c8ffff", "#00e0ff", "#0078c0"],
  pink: ["#ffd4fa", "#ff3ee6", "#a0088a"],
  violet: ["#e6d8ff", "#9a5cff", "#4a12b0"],
};
function crystals(t, flipped) {
  const base = [[1150, 545], [1215, 520]];
  const set = [
    [1150, 545, 0, 70, 20, "cyan"], [1124, 548, -0.4, 46, 15, "pink"],
    [1176, 550, 0.35, 52, 16, "violet"], [1215, 520, 0.1, 54, 16, "pink"],
    [1236, 524, 0.45, 36, 12, "cyan"],
  ];
  // Shadows fall left on screen, so when mirrored they're cast the other way here.
  ellipse(flipped ? 1250 : 1110, 552, 120, 13); g.fillStyle = "rgba(30,0,90,0.3)"; g.fill();
  const pulse = 0.5 + 0.5 * wave(t, 2);
  for (const [x, y] of base) glow(x, y - 30, 130, "rgba(120,240,255,A)", 0.3 + 0.2 * pulse);
  for (const [x, y, rot, h, w, kind] of set) {
    let [light, mid, dark] = GEMS[kind];
    // Keep the bright face towards the light even when the cluster is mirrored.
    if (flipped) [light, dark] = [dark, light];
    g.save(); g.translate(x, y); g.rotate(rot);
    const P = (a, b) => [a * w, -b * h];
    const BL = P(-1, 0), L = P(-1, 0.72), ML = P(-0.3, 0.8), BML = P(-0.3, 0);
    const A = P(0.05, 1), MR = P(0.4, 0.8), BMR = P(0.4, 0), Rr = P(1, 0.72), BR = P(1, 0);
    const face = (pts, fill) => { g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.closePath(); g.fillStyle = fill; g.fill(); };
    face([BL, L, A, ML, BML], dark);
    face([BML, ML, A, MR, BMR], mid);
    face([BMR, MR, A, Rr, BR], light);
    g.beginPath(); [BL, L, A, Rr, BR].forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.closePath(); ink(2.5);
    g.beginPath(); g.moveTo(...BML); g.lineTo(...ML); g.lineTo(...A); g.lineTo(...MR); g.lineTo(...BMR); ink(1.2, "rgba(255,255,255,0.45)");
    const sx = flipped ? -0.65 * w : 0.68 * w;
    g.beginPath(); g.moveTo(sx, -0.12 * h); g.lineTo(sx, -0.62 * h); g.lineWidth = w * 0.13; g.strokeStyle = "rgba(255,255,255,0.7)"; g.stroke();
    g.restore();
  }
  const which = Math.floor((t / T) * 6) % set.length;
  const tf = ((t / T) * 6) % 1;
  const [sx, sy, , sh] = set[which];
  g.globalAlpha = Math.sin(Math.PI * tf);
  glow(sx + 6, sy - sh * 0.8, 30, "rgba(255,255,255,A)", 0.8);
  sparkle(sx + 6, sy - sh * 0.8, 11, "#ffffff"); g.globalAlpha = 1;
}
function flag(t) {
  const x = 1010, y = 478;
  ellipse(x - 50, y + 2, 60, 6); g.fillStyle = "rgba(30,0,90,0.3)"; g.fill();
  g.fillStyle = hGrad(x - 3, x + 3, [[0, "#5a4a9a"], [0.6, "#ffffff"], [1, "#a89ad8"]]);
  g.fillRect(x - 3, y - 112, 6, 112); g.beginPath(); g.rect(x - 3, y - 112, 6, 112); ink(2);
  circle(x, y - 114, 5); g.fillStyle = ball(x, y - 114, 5, [[0, "#ffffff"], [0.5, "#ffd43b"], [1, "#a06a00"]]); g.fill(); ink(1.5);
  // The cloth, in strips shaded by how each ripple faces the light.
  const top = y - 108, w = 66, h = 42, ph = (TAU * 2 * t) / T;
  const yAt = (px) => 4 * Math.sin(px / 14 - ph) * (px / w);
  const N = 14;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * w, b = ((i + 1) / N) * w;
    const slope = Math.cos((a + b) / 2 / 14 - ph);
    const f = 0.5 + 0.5 * slope;
    g.beginPath();
    g.moveTo(x + a, top + yAt(a)); g.lineTo(x + b + 0.6, top + yAt(b)); g.lineTo(x + b + 0.6, top + h + yAt(b)); g.lineTo(x + a, top + h + yAt(a));
    g.closePath();
    g.fillStyle = `rgb(255,${Math.round(lerp(150, 236, f))},${Math.round(lerp(0, 90, f))})`; g.fill();
  }
  g.beginPath(); g.moveTo(x, top);
  for (let i = 0; i <= 12; i++) { const px = (i / 12) * w; g.lineTo(x + px, top + yAt(px)); }
  for (let i = 12; i >= 0; i--) { const px = (i / 12) * w; g.lineTo(x + px, top + h + yAt(px)); }
  g.closePath(); ink(2.5);
  sparkle(x + 33, top + h / 2 + yAt(33), 13, "#ff2d6e");
}

/* ---------- floating moon dust, haze and vignette ---------- */
function moonDust(t) {
  for (const d of dust) {
    const f = ((t / T) * d.k + d.ph) % 1;
    const y = d.y - f * 120;
    g.globalAlpha = Math.sin(Math.PI * f) * 0.75;
    circle(d.x + 8 * Math.sin(f * TAU), (y + H) % H, d.r); g.fillStyle = "#fff0ff"; g.fill();
  }
  g.globalAlpha = 1;
}
/** Far-off things melt into a pink glow along the horizon. */
function horizonHaze() {
  g.fillStyle = vGrad(HORIZON - 30, HORIZON + 70, [[0, "rgba(255,130,220,0)"], [0.35, "rgba(255,140,225,0.45)"], [1, "rgba(255,140,225,0)"]]);
  g.fillRect(0, HORIZON - 30, W, 100);
}
function vignette() {
  const v = g.createRadialGradient(W / 2, H * 0.55, H * 0.45, W / 2, H * 0.55, W * 0.75);
  v.addColorStop(0, "rgba(20,0,60,0)"); v.addColorStop(1, "rgba(20,0,60,0.35)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

function draw(t) {
  t = ((t % T) + T) % T;
  g.clearRect(0, 0, W, H);
  sky(t);
  littlePlanets(t);
  shootingStars(t);
  ringedPlanet(t);
  earth(t);
  ufo(t);
  farHills();
  const camZ = (PERIOD * t) / T;
  groundBase();
  groundMarks(camZ);
  horizonHaze();
  walkingProps(t, camZ);
  moonDust(t);
  vignette();
}
draw(0);
window.frameAt = (t) => { draw(t); return cv.toDataURL("image/png"); };
</script>
